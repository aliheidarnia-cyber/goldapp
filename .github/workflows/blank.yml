name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle
        run: |
          echo "Building app..."
          mkdir -p app/src/main/java/com/example/goldcalculator
          if [ -f MainActivity.kt ]; then
            cp MainActivity.kt app/src/main/java/com/example/goldcalculator/
          fi
          echo "Done"
